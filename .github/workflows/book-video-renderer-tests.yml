name: Book Video Renderer tests

on:
  pull_request:
    paths:
      - "tools/book-video-renderer/**"
      - "examples/book-video/naval-test-001/**"
      - "openspec/changes/real-media-e2e-validation/**"
      - ".github/workflows/book-video-renderer-tests.yml"
  push:
    branches:
      - main
      - feat/book-video-renderer-mvp
    paths:
      - "tools/book-video-renderer/**"
      - "examples/book-video/naval-test-001/**"
      - "openspec/changes/real-media-e2e-validation/**"
      - ".github/workflows/book-video-renderer-tests.yml"
  workflow_dispatch:
    inputs:
      render_tts_sample:
        description: "Generate the first 8-second scene with online Edge TTS (sends narration text to the external TTS service)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
      - name: Install Python dependencies
        run: python -m pip install -r tools/book-video-renderer/requirements.txt
      - name: Compile Python files
        run: |
          python -m py_compile tools/book-video-renderer/renderer.py
          python -m py_compile tools/book-video-renderer/prepare_narration.py
          python -m py_compile tools/book-video-renderer/book_video_renderer/scene.py
          python -m py_compile tools/book-video-renderer/book_video_renderer/providers/video.py
          python -m py_compile tools/book-video-renderer/tests/test_renderer.py
          python -m py_compile tools/book-video-renderer/pipeline.py
          python -m py_compile tools/book-video-renderer/tests/test_pipeline.py
      - name: Run unit and FFmpeg integration tests
        shell: bash
        run: |
          FONT="$(fc-match -f '%{file}' 'Noto Sans CJK SC' | head -n 1)"
          echo "Using CJK font: $FONT"
          test -n "$FONT"
          BOOK_VIDEO_FONT="$FONT" python -m unittest discover -s tools/book-video-renderer/tests -v
      - name: Validate formal PNGs, preserved-ID fixture and guarded preflights
        shell: bash
        run: |
          unset FAL_KEY
          python tools/book-video-renderer/check_e2e_contract.py
          python tools/book-video-renderer/validate_naval.py --remote-ref origin/main --output output/naval-ci/source-validation
          python tools/book-video-renderer/offline_preflight.py \
            --report output/naval-ci/eight-scene-preflight.json \
            examples/book-video/naval-test-001/storyboard.json \
            --output output/naval-ci/full \
            --assets-dir examples/book-video/naval-test-001/source-images \
            --ai-video-provider fal-h3-max-turbo --video-budget-usd 1.20 \
            --video-clip-seconds 5 --video-preflight-only
          python tools/book-video-renderer/offline_preflight.py \
            --report output/naval-ci/two-scene-preflight.json \
            examples/book-video/naval-test-001/validation/two-scene-storyboard.json \
            --output output/naval-ci/two \
            --assets-dir examples/book-video/naval-test-001/source-images \
            --ai-video-provider fal-h3-max-turbo --video-budget-usd .40 \
            --video-clip-seconds 5 --video-preflight-only
      - name: Upload zero-cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naval-zero-cost-evidence
          path: output/naval-ci/
          if-no-files-found: warn
          retention-days: 14

  render-tts-sample:
    if: github.event_name == 'workflow_dispatch' && inputs.render_tts_sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
      - name: Install renderer and optional Edge TTS dependencies
        run: |
          python -m pip install -r tools/book-video-renderer/requirements.txt
          python -m pip install -r tools/book-video-renderer/requirements-tts-edge.txt
      - name: Prepare an 8-second storyboard from the first scene
        run: |
          mkdir -p /tmp/naval-test-001-edge-tts-sample
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("examples/book-video/naval-test-001/storyboard.json")
          sample = json.loads(source.read_text(encoding="utf-8"))
          original_narration = sample["scenes"][0]["narration"]
          sample["scenes"] = sample["scenes"][:1]
          assert len(sample["scenes"]) == 1
          assert sample["scenes"][0]["duration_seconds"] == 8
          sample["format"]["target_duration_seconds"] = sum(
              scene["duration_seconds"] for scene in sample["scenes"]
          )
          assert sample["format"]["target_duration_seconds"] == 8
          assert sample["scenes"][0]["narration"] == original_narration
          Path("/tmp/naval-test-001-edge-tts-sample/storyboard.json").write_text(
              json.dumps(sample, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Prepared first scene only; narration preserved verbatim.")
          PY
      - name: Render 8-second opening sample with real Chinese speech
        run: |
          FONT="$(fc-match -f '%{file}' 'Noto Sans CJK SC' | head -n 1)"
          test -n "$FONT"
          python tools/book-video-renderer/renderer.py \
            /tmp/naval-test-001-edge-tts-sample/storyboard.json \
            --font "$FONT" \
            --output output/naval-test-001-edge-tts \
            --tts-provider edge-tts \
            --tts-voice zh-CN-YunxiNeural
      - name: Upload rendered sample and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naval-test-001-edge-tts
          path: |
            output/naval-test-001-edge-tts/final.mp4
            output/naval-test-001-edge-tts/manifest.json
            output/naval-test-001-edge-tts/subtitles.srt
          if-no-files-found: warn
          retention-days: 7
